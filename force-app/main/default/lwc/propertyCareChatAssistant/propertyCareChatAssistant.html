<template>
    <lightning-card title="PropertyCare Assistant (AI Sandbox Console)" icon-name="utility:chat">
        <div class="slds-p-around_medium">
            <lightning-record-picker 
                label="Active Session Context (Simulated Tenant ID)" 
                placeholder="Search Tenants..."
                object-api-name="Tenant__c"
                value={tenantId}
                onchange={handleTenantChange}
                class="slds-m-bottom_medium">
            </lightning-record-picker>

            <div class="chat-window slds-box slds-theme_shade slds-scrollable_y" style="height: 300px; padding: 10px;">
                <template for:each={messages} for:item="msg">
                    <div key={msg.id} class={msg.cssClass}>
                        <strong>{msg.sender}:</strong> {msg.text}
                    </div>
                </template>
            </div>

            <div class="slds-grid slds-m-top_small">
                <div class="slds-col slds-size_10-of-12">
                    <lightning-input 
                        variant="label-hidden" 
                        placeholder="Type 'book a plumbing repair' or 'check status of SR-0001'..."
                        value={userInput}
                        oncommit={sendMessage}
                        onchange={handleInputChange}
                        disabled={isBotLoading}>
                    </lightning-input>
                </div>
                <div class="slds-col slds-size_2-of-12 slds-p-left_x-small">
                    <lightning-button 
                        label="Send" 
                        variant="brand" 
                        onclick={sendMessage} 
                        disabled={isBotLoading}
                        class="slds-stretch">
                    </lightning-button>
                </div>
            </div>
        </div>
    </lightning-card>
</template>
